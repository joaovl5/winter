[global]
  exclude           = [
    ".git",
    ".github",
    "node_modules",
    "vendor",
    "dist",
    "build"
  ]
  respect-gitignore = true
  flavor            = "gfm"
  disable           = ["MD033", "MD041"]

[MD013]
  line-length = 70
  code-blocks = false
  tables      = false
  headings    = false
  reflow      = true
  reflow-mode = "default"

[MD036]
  fix           = true
  heading-level = 4
  heading-style = "atx"

[MD041]
  fix                        = true
  front-matter-title-pattern = "^(name|title):"

[MD076]
  style                    = "tight"
  allow-loose-continuation = true
